# Render.com Blueprint — near one-click deploy of the web backend.
#
# How to use:
#   1. Push this repo to GitHub (already done).
#   2. On Render: New +  ->  Blueprint  ->  connect this repo.
#   3. Render reads this file and creates the service. Fill in the values it
#      prompts for (marked sync:false below): WEB_APP_PASSWORD and the API keys
#      of the providers you use. WEB_APP_SECRET is generated automatically.
#   4. Deploy. You get a URL like https://product-image-batch.onrender.com
#      -> put that URL into web/static/labor.html ("App öffnen") and, if you like,
#      point a Cloudflare CNAME (app.dennisbf.design) at it (see docs/WEB_DEPLOY.md).
#
# Notes:
#   - The server refuses to start without WEB_APP_PASSWORD (safety).
#   - Free instances sleep when idle and lose the outputs/ folder on restart;
#     attach a disk (below) or upgrade for persistence.

services:
  - type: web
    name: product-image-batch
    runtime: python
    plan: starter            # kostenpflichtig: immer an (kein Schlafen) + erlaubt
                             # einen persistenten Datenträger (siehe disk: unten).
                             # Für kostenlos zurück auf "free" — dann aber KEIN disk
                             # und Projekte/Ergebnisse sind nach Neustart weg.
    region: frankfurt        # closest to Mannheim/Heidelberg
    buildCommand: pip install -r requirements.txt -r requirements-web.txt
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- required ---
      - key: WEB_APP_PASSWORD        # you set this (login password)
        sync: false
      - key: WEB_APP_SECRET          # auto-generated secure token secret
        generateValue: true
      # --- optional: overall spend cap in USD (empty = no cap) ---
      - key: WEB_BUDGET_CAP_USD
        sync: false
      # --- optional: tune parallelism without editing code ---
      # Raise for real (paid) accounts so agents generate at once; lower if a
      # Tier-1 account hits 429 rate-limit errors. PIB_OPENAI_RPM=0 disables the
      # per-minute rate limit for OpenAI. Same pattern for other providers
      # (PIB_FAL_CONCURRENCY, PIB_REPLICATE_RPM, …).
      - key: PIB_GLOBAL_MAX_CONCURRENT
        sync: false
      - key: PIB_OPENAI_CONCURRENCY
        sync: false
      - key: PIB_OPENAI_RPM
        sync: false
      # --- persistent storage (on the disk mounted at /data below) ---
      # Saved projects and generated images live on the persistent disk, so they
      # survive restarts/redeploys. On the free plan (no disk) remove these two
      # and both fall back to the ephemeral container filesystem.
      - key: WEB_WORKSPACES_DIR
        value: /data/workspaces
      - key: WEB_OUTPUT_DIR
        value: /data/outputs
      # --- provider keys: fill in only the ones you use; leave others blank ---
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: BFL_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: IDEOGRAM_API_KEY
        sync: false
      - key: RECRAFT_API_TOKEN
        sync: false
      - key: LEONARDO_API_KEY
        sync: false
    # Persistenter Datenträger — gemountet unter /data. Hier liegen die
    # gespeicherten Projekte (/data/workspaces) und die erzeugten Bilder
    # (/data/outputs), siehe WEB_WORKSPACES_DIR / WEB_OUTPUT_DIR oben. So bleiben
    # beide über Neustarts und Deploys hinweg erhalten. sizeGB bei Bedarf erhöhen
    # (Bilder summieren sich). Erfordert einen kostenpflichtigen Plan (starter).
    disk:
      name: data
      mountPath: /data
      sizeGB: 2
