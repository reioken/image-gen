[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-image-batch"
version = "0.1.0"
description = "Parallel product-image generation from reference images across many image APIs, with a PySide6 desktop GUI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Product Image Batch" }]
keywords = ["image-generation", "product-photography", "async", "gui", "batch"]

dependencies = [
    "httpx>=0.27",
    "aiofiles>=23.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "rich>=13.7",
    "Pillow>=10.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
csv = ["pandas>=2.2"]
limits = ["aiolimiter>=1.1"]
build = ["pyinstaller>=6.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
all = [
    "PySide6>=6.6",
    "pandas>=2.2",
    "aiolimiter>=1.1",
    "pyinstaller>=6.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
product-image-batch = "product_image_batch.cli:main"

[project.gui-scripts]
product-image-batch-gui = "product_image_batch.gui.app:main"

[tool.setuptools.packages.find]
include = ["product_image_batch*", "web*"]

[tool.setuptools.package-data]
web = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
